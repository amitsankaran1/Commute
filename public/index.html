<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Commute Board</title>
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#0e0e0e" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Commute" />
  <link rel="apple-touch-icon" href="/icons/icon.svg" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0e0e0e;
      --card: #161616;
      --border: #2a2a2a;
      --text: #f0f0f0;
      --muted: #666;
      --f:   #FF6319;
      --g:   #6CBE45;
      --ac:  #2850AD;
      --123: #EE352E;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    header {
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .mode-toggle {
      display: flex;
      background: #1a1a1a;
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }

    .mode-btn {
      background: none;
      border: none;
      color: var(--muted);
      padding: 6px 14px;
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      transition: color 0.15s, background 0.15s;
      white-space: nowrap;
    }

    .mode-btn.active { background: #2a2a2a; color: var(--text); }
    .mode-btn:hover:not(.active) { color: #aaa; }

    .route-label {
      font-size: 0.78rem;
      color: var(--muted);
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #status { font-size: 0.75rem; color: var(--muted); flex-shrink: 0; }

    /* ── Main ── */
    main { flex: 1; padding: 20px; display: flex; flex-direction: column; gap: 16px; }

    /* ── Plan cards ── */
    .plans-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    @media (max-width: 560px) {
      .plans-row { grid-template-columns: 1fr; }
    }

    .plan-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .plan-card.plan-a { border-color: #3a3a3a; }

    .plan-rank {
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      color: var(--muted);
      text-transform: uppercase;
    }

    .plan-leave {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .plan-leave-label {
      font-size: 0.72rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .plan-leave-value {
      font-size: 2.4rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    .plan-leave-value.urgent { color: #f87171; }
    .plan-leave-value.soon   { color: #facc15; }
    .plan-leave-value.ok     { color: var(--text); }

    .plan-leave-unit {
      font-size: 1rem;
      font-weight: 400;
      color: var(--muted);
      margin-left: 4px;
    }

    .plan-arrive {
      font-size: 0.88rem;
      color: var(--muted);
    }

    .plan-arrive strong { color: var(--text); font-weight: 600; }

    /* ── Legs ── */
    .plan-legs {
      display: flex;
      flex-direction: column;
      border-top: 1px solid var(--border);
      padding-top: 14px;
      gap: 0;
    }

    .leg {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 0;
      font-size: 0.82rem;
    }

    .leg-icon {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      font-weight: 800;
      color: #fff;
      flex-shrink: 0;
      font-family: 'Helvetica Neue', Arial, sans-serif;
    }

    .leg-icon.walk     { background: #333; font-size: 0.8rem; font-weight: 400; color: var(--muted); }
    .leg-icon.transfer { background: #333; font-size: 0.7rem; font-weight: 400; color: var(--muted); }

    .leg-label { flex: 1; color: var(--text); }
    .leg-label .departs { color: var(--muted); font-size: 0.75rem; margin-left: 6px; }

    .leg-mins {
      font-size: 0.75rem;
      color: var(--muted);
      text-align: right;
      flex-shrink: 0;
    }

    /* ── Walk fallback ── */
    .walk-fallback {
      background: #111;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      opacity: 0.5;
      transition: opacity 0.2s;
    }

    .walk-fallback:hover { opacity: 1; }

    .walk-fallback-label {
      font-size: 0.72rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      flex-shrink: 0;
    }

    .walk-fallback-desc {
      flex: 1;
      font-size: 0.83rem;
      color: #999;
    }

    .walk-fallback-arrive {
      font-size: 0.83rem;
      color: var(--muted);
      flex-shrink: 0;
      white-space: nowrap;
    }

    .walk-fallback-arrive strong { color: #aaa; }

    .plan-next {
      font-size: 0.78rem;
      color: var(--muted);
      border-top: 1px solid var(--border);
      padding-top: 12px;
      margin-top: 2px;
    }

    .plan-next-label { display: block; font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 3px; }
    .plan-next strong { color: #aaa; }

    .plan-suppressed {
      opacity: 0.35;
      display: flex;
      flex-direction: column;
      gap: 10px;
      justify-content: flex-start;
    }

    .plan-suppressed:hover { opacity: 0.7; }

    .plan-suppressed-msg {
      font-size: 0.82rem;
      color: var(--muted);
      line-height: 1.5;
    }

    /* ── Evening station cards ── */
    .stations-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 12px;
    }

    .station-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .station-header { display: flex; align-items: flex-start; gap: 10px; }

    .color-bar {
      width: 4px;
      border-radius: 2px;
      flex-shrink: 0;
      margin-top: 2px;
      align-self: stretch;
      min-height: 32px;
    }

    .station-info h2 { font-size: 1.1rem; font-weight: 700; }
    .station-info p  { font-size: 0.78rem; color: var(--muted); margin-top: 2px; }

    .arrivals { display: flex; flex-direction: column; }

    .arrival-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 9px 0;
      border-bottom: 1px solid var(--border);
    }

    .arrival-row:last-child { border-bottom: none; }

    .bullet {
      width: 26px; height: 26px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.8rem; font-weight: 800; color: #fff;
      flex-shrink: 0;
      font-family: 'Helvetica Neue', Arial, sans-serif;
    }

    .arrival-dir { font-size: 0.77rem; color: var(--muted); flex: 1; }

    .arrival-time {
      font-size: 1.35rem; font-weight: 700;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.02em;
      flex-shrink: 0;
    }

    .arrival-time .unit { font-size: 0.68rem; font-weight: 400; color: var(--muted); margin-left: 2px; }
    .arrival-time.now  { color: #22c55e; }
    .arrival-time.soon { color: #facc15; }

    .no-trains { color: var(--muted); font-size: 0.83rem; padding: 8px 0; }

    /* ── Weather strip ── */
    .weather-strip {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 18px;
      display: flex;
      align-items: center;
      gap: 14px;
      font-size: 0.85rem;
    }

    .weather-main {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
      min-width: 0;
    }

    .weather-icon { font-size: 1.3rem; line-height: 1; flex-shrink: 0; }

    .weather-temp {
      font-size: 1.2rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      flex-shrink: 0;
    }

    .weather-condition { color: var(--muted); flex-shrink: 0; }

    .weather-details {
      display: flex;
      gap: 10px;
      color: var(--muted);
      font-size: 0.78rem;
      flex-shrink: 0;
    }

    .weather-walk {
      font-size: 0.8rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 6px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .weather-walk.great { background: #14532d44; color: #4ade80; border: 1px solid #14532d; }
    .weather-walk.ok    { background: #78350f44; color: #fbbf24; border: 1px solid #78350f; }
    .weather-walk.skip  { background: #1f1f1f;   color: var(--muted); border: 1px solid var(--border); }

    /* ── Bell button ── */
    .bell-btn {
      background: none;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--muted);
      font-size: 1rem;
      padding: 5px 9px;
      cursor: pointer;
      transition: color 0.15s, border-color 0.15s;
      flex-shrink: 0;
    }
    .bell-btn:hover { color: var(--text); border-color: #555; }
    .bell-btn.active { color: #facc15; border-color: #78350f; }

    /* ── Settings sheet ── */
    .sheet-backdrop {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.6);
      opacity: 0; pointer-events: none;
      transition: opacity 0.25s;
      z-index: 10;
    }
    .sheet-backdrop.open { opacity: 1; pointer-events: auto; }

    .sheet {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: #1a1a1a;
      border-top: 1px solid var(--border);
      border-radius: 20px 20px 0 0;
      padding: 0 0 env(safe-area-inset-bottom, 16px);
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.32, 0.72, 0, 1);
      z-index: 11;
      max-width: 600px;
      margin: 0 auto;
    }
    .sheet.open { transform: translateY(0); }

    .sheet-handle {
      width: 36px; height: 4px;
      background: #444; border-radius: 2px;
      margin: 12px auto 0;
    }

    .sheet-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 20px 12px;
      border-bottom: 1px solid var(--border);
    }

    .sheet-title { font-weight: 600; font-size: 1rem; }

    .sheet-close {
      background: none; border: none;
      color: var(--muted); font-size: 1rem;
      cursor: pointer; padding: 4px 8px;
      border-radius: 6px;
    }
    .sheet-close:hover { color: var(--text); background: #2a2a2a; }

    .sheet-body { padding: 8px 20px 16px; display: flex; flex-direction: column; gap: 4px; }

    .setting-row {
      display: flex; align-items: center; justify-content: space-between;
      gap: 16px; padding: 14px 0;
      border-bottom: 1px solid var(--border);
    }
    .setting-row:last-of-type { border-bottom: none; }

    .setting-label { flex: 1; cursor: default; }
    .setting-name  { font-size: 0.9rem; font-weight: 500; }
    .setting-desc  { font-size: 0.75rem; color: var(--muted); margin-top: 2px; }

    /* iOS-style toggle */
    .toggle { position: relative; flex-shrink: 0; }
    .toggle input { position: absolute; opacity: 0; width: 0; height: 0; }
    .toggle-track {
      display: block; width: 48px; height: 28px;
      background: #3a3a3a; border-radius: 14px;
      transition: background 0.2s; cursor: pointer;
      position: relative;
    }
    .toggle input:checked + .toggle-track { background: #34d399; }
    .toggle-thumb {
      position: absolute; top: 3px; left: 3px;
      width: 22px; height: 22px;
      background: white; border-radius: 50%;
      transition: left 0.2s; box-shadow: 0 1px 4px rgba(0,0,0,0.4);
    }
    .toggle input:checked + .toggle-track .toggle-thumb { left: 23px; }

    .time-input {
      background: #2a2a2a; border: 1px solid var(--border);
      color: var(--text); border-radius: 8px;
      padding: 8px 12px; font-size: 1rem;
      font-family: inherit; outline: none;
      width: 130px; flex-shrink: 0;
    }
    .time-input:focus { border-color: #555; }

    #timeRow { transition: opacity 0.2s; }
    #timeRow.hidden { opacity: 0.3; pointer-events: none; }

    .sheet-actions {
      display: flex; gap: 10px; padding-top: 8px;
    }

    .sheet-btn {
      flex: 1; padding: 12px;
      border-radius: 10px; border: none;
      font-size: 0.9rem; font-weight: 600;
      cursor: pointer; transition: opacity 0.15s;
    }
    .sheet-btn:hover { opacity: 0.85; }
    .sheet-btn.primary   { background: #FF6319; color: white; }
    .sheet-btn.secondary { background: #2a2a2a; color: var(--text); border: 1px solid var(--border); }

    .sheet-note {
      font-size: 0.75rem; color: var(--muted);
      text-align: center; min-height: 1.2em;
      padding-top: 4px;
    }
    .sheet-note.ok  { color: #34d399; }
    .sheet-note.err { color: #f87171; }

    /* ── Error / Loading ── */
    .msg-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      color: var(--muted);
      font-size: 0.88rem;
      line-height: 1.6;
    }

    .msg-card.error { color: #f87171; }

    /* ── Footer ── */
    footer {
      padding: 10px 20px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    footer span { font-size: 0.72rem; color: var(--muted); }

    .refresh-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 5px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.75rem;
    }

    .refresh-btn:hover { border-color: #555; }
    .refresh-btn:disabled { opacity: 0.35; cursor: default; }

    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    .spinner {
      display: inline-block;
      width: 10px; height: 10px;
      border: 2px solid var(--muted);
      border-top-color: var(--text);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin-right: 5px;
      vertical-align: middle;
    }
  </style>
</head>
<body>
  <header>
    <div class="mode-toggle">
      <button class="mode-btn" id="btn-to"     onclick="setMode('to')">To office</button>
      <button class="mode-btn" id="btn-from"   onclick="setMode('from')">From office</button>
      <button class="mode-btn" id="btn-bergen" onclick="setMode('bergen')">At Bergen St</button>
    </div>
    <span class="route-label" id="route-label"></span>
    <span id="status"></span>
    <button class="bell-btn" id="bellBtn" onclick="openSettings()" title="Alert settings" aria-label="Alert settings">🔔</button>
  </header>

  <!-- Settings sheet -->
  <div class="sheet-backdrop" id="sheetBackdrop" onclick="closeSettings()"></div>
  <div class="sheet" id="settingsSheet" role="dialog" aria-modal="true" aria-label="Alert settings">
    <div class="sheet-handle"></div>
    <div class="sheet-header">
      <span class="sheet-title">Alert settings</span>
      <button class="sheet-close" onclick="closeSettings()">✕</button>
    </div>

    <div class="sheet-body">
      <div class="setting-row">
        <div class="setting-label">
          <div class="setting-name">Morning push alert</div>
          <div class="setting-desc">Pings you when it's time to leave</div>
        </div>
        <label class="toggle">
          <input type="checkbox" id="alertEnabled" onchange="onAlertToggle()" />
          <span class="toggle-track"><span class="toggle-thumb"></span></span>
        </label>
      </div>

      <div class="setting-row" id="timeRow">
        <label class="setting-label" for="alertTime">
          <div class="setting-name">Alert time</div>
          <div class="setting-desc">Sends a real-time "leave in X min" notification</div>
        </label>
        <input type="time" class="time-input" id="alertTime" />
      </div>

      <div class="sheet-actions">
        <button class="sheet-btn secondary" id="testBtn" onclick="sendTestAlert()">Send test</button>
        <button class="sheet-btn primary" onclick="saveSettings()">Save</button>
      </div>

      <div class="sheet-note" id="sheetNote"></div>
    </div>
  </div>

  <main id="board">
    <div class="msg-card"><span class="spinner"></span> Loading…</div>
  </main>

  <footer>
    <span id="last-updated">–</span>
    <button class="refresh-btn" id="refreshBtn" onclick="load()">Refresh</button>
  </footer>

  <script>
    const ROUTE_COLORS = {
      F: '#FF6319', G: '#6CBE45',
      A: '#2850AD', C: '#2850AD', E: '#2850AD',
      '1': '#EE352E', '2': '#EE352E', '3': '#EE352E',
    };

    const ROUTE_LABELS = {
      to:     '331 Clinton St → 75 Varick St',
      from:   '75 Varick St → 331 Clinton St',
      bergen: 'Bergen St → 75 Varick St',
    };

    let mode = new Date().getHours() < 14 ? 'to' : 'from';
    let manualOverride = false;
    let refreshTimer = null;

    function setMode(m, manual = true) {
      mode = m;
      if (manual) manualOverride = true;
      document.getElementById('btn-to').classList.toggle('active',     m === 'to');
      document.getElementById('btn-from').classList.toggle('active',   m === 'from');
      document.getElementById('btn-bergen').classList.toggle('active', m === 'bergen');
      document.getElementById('route-label').textContent = ROUTE_LABELS[m] ?? '';
      load();
    }

    function fmtTime(ts) {
      return new Date(ts * 1000).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
    }

    function fmtMins(minsAway) {
      if (minsAway <= 0) return { text: 'Now',  cls: 'now',  unit: '' };
      if (minsAway <= 1) return { text: '1',    cls: 'soon', unit: 'min' };
      if (minsAway <= 4) return { text: String(minsAway), cls: 'soon', unit: 'min' };
      return { text: String(minsAway), cls: '', unit: 'min' };
    }

    // ── Morning: plan cards ──────────────────────────────────────────

    function leaveDisplay(leaveInMin) {
      if (leaveInMin <= 0) return { text: 'Now', cls: 'urgent', unit: '' };
      if (leaveInMin <= 3) return { text: String(leaveInMin), cls: 'urgent', unit: 'min' };
      if (leaveInMin <= 7) return { text: String(leaveInMin), cls: 'soon',   unit: 'min' };
      return { text: String(leaveInMin), cls: 'ok', unit: 'min' };
    }

    function renderLeg(leg) {
      const row = document.createElement('div');
      row.className = 'leg';
      let icon;
      if (leg.kind === 'train') {
        icon = `<div class="leg-icon" style="background:${ROUTE_COLORS[leg.route] || '#888'}">${leg.route}</div>`;
      } else if (leg.kind === 'walk') {
        icon = `<div class="leg-icon walk">↑</div>`;
      } else {
        icon = `<div class="leg-icon transfer">⇄</div>`;
      }
      const departs = leg.ts ? `<span class="departs">${fmtTime(leg.ts)}</span>` : '';
      row.innerHTML = `
        ${icon}
        <span class="leg-label">${leg.label}${departs}</span>
        <span class="leg-mins">${leg.mins} min</span>
      `;
      return row;
    }

    function renderPlanCard(plan, nextPlan) {
      const card = document.createElement('div');
      card.className = 'plan-card' + (plan.rank === 'A' ? ' plan-a' : '');

      const { text, cls, unit } = leaveDisplay(plan.leaveInMin);
      const arriveStr = fmtTime(plan.officeTs);

      // Next-train row for Plan A
      let nextHtml = '';
      if (nextPlan) {
        const nd = leaveDisplay(nextPlan.leaveInMin);
        nextHtml = `
          <div class="plan-next">
            <span class="plan-next-label">or next train:</span>
            leave in <strong>${nd.text}${nd.unit ? ' ' + nd.unit : ''}</strong>
            → arrive <strong>~${fmtTime(nextPlan.officeTs)}</strong>
          </div>`;
      }

      card.innerHTML = `
        <div class="plan-rank">Plan ${plan.rank}</div>
        <div class="plan-leave">
          <div class="plan-leave-label">Leave in</div>
          <div class="plan-leave-value ${cls}">${text}${unit ? `<span class="plan-leave-unit">${unit}</span>` : ''}</div>
        </div>
        <div class="plan-arrive">Arrive <strong>~${arriveStr}</strong> &nbsp;·&nbsp; ${plan.routeLabel}</div>
        <div class="plan-legs"></div>
        ${nextHtml}
      `;

      const legsEl = card.querySelector('.plan-legs');
      for (const leg of plan.legs) legsEl.appendChild(renderLeg(leg));
      return card;
    }

    function renderWalkFallback(plan) {
      if (!plan) return null;
      const el = document.createElement('div');
      el.className = 'walk-fallback';
      const arriveStr = fmtTime(plan.officeTs);
      el.innerHTML = `
        <div class="walk-fallback-label">If F + G down</div>
        <div class="walk-fallback-desc">Walk 15 min to Jay St, catch ${plan.acRoute} at ${fmtTime(plan.acTs)}</div>
        <div class="walk-fallback-arrive">Arrive <strong>~${arriveStr}</strong></div>
      `;
      return el;
    }

    function renderPlans(data) {
      const board = document.getElementById('board');
      board.innerHTML = '';

      if (!data.planA) {
        board.innerHTML = `<div class="msg-card">No viable plans in the next hour.</div>`;
        return;
      }

      const row = document.createElement('div');
      row.className = 'plans-row';

      // Plan A — always shown, with next-train option if available
      row.appendChild(renderPlanCard(data.planA, data.planANext));

      // Plan B — only shown if G route is within threshold
      if (data.planB) {
        row.appendChild(renderPlanCard(data.planB, null));
      } else if (data.planBDeltaMins !== null) {
        // G exists but is too slow — show a suppressed note
        const note = document.createElement('div');
        note.className = 'plan-card plan-suppressed';
        note.innerHTML = `
          <div class="plan-rank">G → A/C</div>
          <div class="plan-suppressed-msg">
            ${data.planBDeltaMins} min slower than Plan A today.<br>
            Not worth the harder Hoyt transfer.
          </div>
        `;
        row.appendChild(note);
      }

      board.appendChild(row);

      const walk = renderWalkFallback(data.walkFallback);
      if (walk) board.appendChild(walk);
    }

    // ── Evening: station cards ───────────────────────────────────────

    function renderStation(s) {
      const card = document.createElement('div');
      card.className = 'station-card';
      card.innerHTML = `
        <div class="station-header">
          <div class="color-bar" style="background:${s.color}"></div>
          <div class="station-info"><h2>${s.label}</h2><p>${s.subtitle}</p></div>
        </div>
        <div class="arrivals"></div>
      `;
      const arrivalsEl = card.querySelector('.arrivals');
      if (!s.arrivals?.length) {
        arrivalsEl.innerHTML = `<p class="no-trains">No trains in the next hour</p>`;
      } else {
        for (const a of s.arrivals) {
          const { text, cls, unit } = fmtMins(a.minsAway);
          const row = document.createElement('div');
          row.className = 'arrival-row';
          row.innerHTML = `
            <div class="bullet" style="background:${ROUTE_COLORS[a.route] || '#888'}">${a.route}</div>
            <div class="arrival-dir">${a.direction}</div>
            <div class="arrival-time ${cls}">${text}${unit ? `<span class="unit">${unit}</span>` : ''}</div>
          `;
          arrivalsEl.appendChild(row);
        }
      }
      return card;
    }

    function renderStations(data) {
      const board = document.getElementById('board');
      board.innerHTML = '';
      const grid = document.createElement('div');
      grid.className = 'stations-grid';
      for (const s of data.stations) grid.appendChild(renderStation(s));
      board.appendChild(grid);
    }

    // ── Weather strip ─────────────────────────────────────────────────

    function renderWeatherStrip(w) {
      const el = document.createElement('div');
      el.className = 'weather-strip';
      const windStr = w.windMph > 0 ? `💨 ${w.windMph} mph` : '';
      const precipStr = w.precipIn > 0 ? `🌂 ${w.precipIn.toFixed(2)}"` : '';
      const details = [windStr, precipStr].filter(Boolean).join(' · ');
      el.innerHTML = `
        <div class="weather-main">
          <span class="weather-icon">${w.icon}</span>
          <span class="weather-temp">${w.tempF}°F</span>
          <span class="weather-condition">${w.condition}</span>
          ${details ? `<span class="weather-details">${details}</span>` : ''}
        </div>
        <div class="weather-walk ${w.walk.verdict}">${w.walk.label}</div>
      `;
      return el;
    }

    // ── Load ─────────────────────────────────────────────────────────

    async function load() {
      const btn = document.getElementById('refreshBtn');
      const status = document.getElementById('status');
      btn.disabled = true;
      status.innerHTML = '<span class="spinner"></span>';

      try {
        const url = mode === 'to'     ? '/api/plans'     :
                    mode === 'bergen' ? '/api/bergen'     :
                                        '/api/departures';
        const fetches = [fetch(url)];
        if (mode === 'to') fetches.push(fetch('/api/weather'));
        const [res, weatherRes] = await Promise.all(fetches);
        const data = await res.json();
        const board = document.getElementById('board');

        if (!res.ok || data.error) {
          board.innerHTML = `<div class="msg-card error">${data.error || 'Unknown error'}</div>`;
        } else {
          if (mode === 'to' || mode === 'bergen') {
            renderPlans(data);
            if (mode === 'to' && weatherRes) {
              const w = await weatherRes.json();
              if (!w.error) board.prepend(renderWeatherStrip(w));
            }
          } else {
            renderStations(data);
          }

          const d = new Date(data.fetchedAt);
          document.getElementById('last-updated').textContent =
            'Updated ' + d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        }
        status.textContent = '';
      } catch (err) {
        status.textContent = 'Error';
        console.error(err);
      }

      btn.disabled = false;
      clearTimeout(refreshTimer);
      refreshTimer = setTimeout(() => {
        if (!manualOverride) {
          const auto = new Date().getHours() < 14 ? 'to' : 'from';
          if (auto !== mode) { setMode(auto, false); return; }
        }
        load();
      }, 30_000);
    }

    // ── PWA: Service Worker registration ─────────────────────────────
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(err =>
        console.warn('SW registration failed:', err)
      );
    }

    // ── Settings sheet ────────────────────────────────────────────────
    let vapidPublicKey = null;

    function urlBase64ToUint8Array(base64String) {
      const padding = '='.repeat((4 - base64String.length % 4) % 4);
      const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
      const raw = atob(base64);
      return Uint8Array.from([...raw].map(c => c.charCodeAt(0)));
    }

    async function ensureVapidKey() {
      if (vapidPublicKey) return vapidPublicKey;
      const r = await fetch('/api/push/vapid-public-key');
      vapidPublicKey = (await r.json()).key;
      return vapidPublicKey;
    }

    async function openSettings() {
      // Load current config from server
      const cfg = await fetch('/api/alert-config').then(r => r.json()).catch(() => ({ enabled: false, time: '08:15' }));
      document.getElementById('alertEnabled').checked = cfg.enabled;
      document.getElementById('alertTime').value = cfg.time;
      document.getElementById('timeRow').classList.toggle('hidden', !cfg.enabled);
      document.getElementById('sheetNote').textContent = '';
      document.getElementById('sheetNote').className = 'sheet-note';

      document.getElementById('settingsSheet').classList.add('open');
      document.getElementById('sheetBackdrop').classList.add('open');
      document.getElementById('bellBtn').classList.add('active');
    }

    function closeSettings() {
      document.getElementById('settingsSheet').classList.remove('open');
      document.getElementById('sheetBackdrop').classList.remove('open');
      document.getElementById('bellBtn').classList.remove('active');
    }

    function onAlertToggle() {
      const enabled = document.getElementById('alertEnabled').checked;
      document.getElementById('timeRow').classList.toggle('hidden', !enabled);
    }

    function showNote(msg, type = '') {
      const el = document.getElementById('sheetNote');
      el.textContent = msg;
      el.className = 'sheet-note' + (type ? ' ' + type : '');
    }

    async function getPushSubscription() {
      if (!('Notification' in window) || !('serviceWorker' in navigator)) return null;

      const permission = await Notification.requestPermission();
      if (permission !== 'granted') {
        showNote('Notification permission denied.', 'err');
        return null;
      }

      const reg = await navigator.serviceWorker.ready;
      const key = await ensureVapidKey();
      let sub = await reg.pushManager.getSubscription();
      if (!sub) {
        sub = await reg.pushManager.subscribe({
          userVisibleOnly: true,
          applicationServerKey: urlBase64ToUint8Array(key),
        });
      }
      return sub;
    }

    async function saveSettings() {
      const enabled = document.getElementById('alertEnabled').checked;
      const time    = document.getElementById('alertTime').value;

      if (enabled) {
        showNote('Subscribing…');
        const sub = await getPushSubscription();
        if (!sub) return; // permission denied, message already shown

        const r = await fetch('/api/push/subscribe', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(sub),
        });
        if (!r.ok) { showNote('Failed to save subscription.', 'err'); return; }
      }

      const r = await fetch('/api/alert-config', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ enabled, time }),
      });

      if (r.ok) {
        showNote(enabled ? `Alert set for ${time} ✓` : 'Alerts disabled.', 'ok');
      } else {
        showNote('Failed to save.', 'err');
      }
    }

    async function sendTestAlert() {
      const btn = document.getElementById('testBtn');
      btn.disabled = true;
      showNote('Sending test…');

      // Make sure we're subscribed first
      const sub = await getPushSubscription();
      if (sub) {
        await fetch('/api/push/subscribe', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(sub),
        });
      }

      const r = await fetch('/api/push/test', { method: 'POST' });
      const data = await r.json().catch(() => ({}));
      if (r.ok && data.sent > 0) {
        showNote('Test notification sent!', 'ok');
      } else if (data.sent === 0) {
        showNote('No subscribers — try saving first.', 'err');
      } else {
        showNote('Failed to send test.', 'err');
      }
      btn.disabled = false;
    }

    setMode(mode, false);
  </script>
</body>
</html>
